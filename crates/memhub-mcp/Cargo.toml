[package]
name = "memhub-mcp"
description = "MCP server (Streamable HTTP + stdio) for Cross-Repo Memory Hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "memhub"
path = "src/main.rs"

[dependencies]
memhub-store.workspace = true
memhub-audit.workspace = true
memhub-app.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rust_xlsxwriter = "0.96.0"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
