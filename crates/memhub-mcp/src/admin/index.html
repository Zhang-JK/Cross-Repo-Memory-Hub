<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/admin/app.css?v=__ASSET_VERSION__">

<body>

      <a class="brand" href="#/dashboard">
        <span class="brand-mark">M</span>

      <nav class="nav">
